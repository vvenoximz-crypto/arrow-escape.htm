<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151f">
<title>Arrow Escape</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f8;--panel:#fff;--ink:#1b2030;--mute:#6b7288;--dot:#c9cdda;--line:#dde0ea;--accent:#2f5bea;--on:#fff;
--a0:#e5483b;--a1:#e8970c;--a2:#12a27a;--a3:#2f7fe0;--a4:#7c5ce6;--a5:#d6409f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--panel:#1c2130;--ink:#eef0f7;--mute:#8e96ae;--dot:#2a3042;--line:#2a3042;--accent:#6f93ff;--on:#0e1220;
--a0:#ff6b5e;--a1:#ffc247;--a2:#4fd1a5;--a3:#5aaaf5;--a4:#a78bfa;--a5:#f472b6}}
:root[data-theme="dark"]{--bg:#12151f;--panel:#1c2130;--ink:#eef0f7;--mute:#8e96ae;--dot:#2a3042;--line:#2a3042;--accent:#6f93ff;--on:#0e1220;
--a0:#ff6b5e;--a1:#ffc247;--a2:#4fd1a5;--a3:#5aaaf5;--a4:#a78bfa;--a5:#f472b6}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);
font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
.t{text-align:center;line-height:1.15}
h1{font-size:20px;font-weight:700;margin:0}
small{color:var(--mute);font-size:13px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.p{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
#hearts{font-size:20px;letter-spacing:3px;color:var(--a0)}
.r{display:flex;gap:8px;align-items:center}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.z{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.z.l{right:auto;left:12px}
.ch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ch button.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
.z button{width:46px;height:46px;padding:0;font-size:22px;line-height:1}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,20,.55);padding:20px}
#ov.on{display:flex}
#box{background:var(--panel);border-radius:20px;padding:22px;max-width:360px;width:100%;max-height:80%;overflow:auto;text-align:center}
#box h2{margin:0 0 6px;font-size:24px}
#box p{margin:0 0 16px;color:var(--mute)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#grid button{padding:10px 0}
#grid button:disabled{opacity:.35}
#grid button.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
.pg{display:flex;align-items:center;justify-content:space-between;margin:14px 0;color:var(--mute)}
</style>
</head>
<body>
<header>
  <button id="lv" aria-label="Choose level">Levels</button>
  <div class="t"><h1 id="title">Level 1</h1><small id="left"></small></div>
  <div class="r"><span id="hearts" aria-label="Hearts left"></span><button id="hint">Hint</button></div>
</header>
<div id="stage"><canvas id="cv"></canvas>
  <div class="z l"><button id="su" style="width:auto;padding:0 14px;font-size:15px">Setup</button></div>
  <div class="z"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zf" aria-label="Fit to screen" style="font-size:13px">Fit</button></div>
</div>
<div id="ov"><div id="box"></div></div>
<script>
const $=q=>document.querySelector(q),cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage'),ov=$('#ov'),box=$('#box');
const MAX=2000,D=[[0,1],[1,0],[0,-1],[-1,0]];
const GL=['Off','Slow','Normal','Fast','Huge'],GR=[0,.25,.6,1.2,2.5],DL=['Easy','Normal','Hard','Brutal'],DM=[.6,1,1.5,2.2];
let unlocked=1,level=1,G=null,lives=3,s=1,ox=0,oy=0,W=0,H=0,bs=1,bx=0,by=0,z=1,px=0,py=0,cols=[],over=false,cfg={g:2,d:1};
try{unlocked=Math.min(MAX,Math.max(1,+localStorage.getItem('arrowEscape')||1));Object.assign(cfg,JSON.parse(localStorage.getItem('arrowEscapeCfg')||'{}'))}catch(e){}
cfg.g=Math.min(4,Math.max(0,cfg.g|0));cfg.d=Math.min(3,Math.max(0,cfg.d|0));
const save=()=>{try{localStorage.setItem('arrowEscape',unlocked)}catch(e){}};
const K=(r,c)=>r*256+c;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dims(L){const g=GR[cfg.g];return g?{nc:Math.min(80,4+(L*g*.7|0)),nr:Math.min(120,5+(L*g|0))}:{nc:9,nr:13}}

/* Every level: bigger board (your choice), tighter packing, longer snakes, armored arrows. */
function gen(L){
  const {nc,nr}=dims(L),E=L*DM[cfg.d],R=rng(L*7919+13+cfg.g*104729+cfg.d*1299709);
  const maxLen=Math.min(2+(E/8|0),16),target=Math.min(.42+E*.006,.9),p2=Math.min(.45,E*.01-.05),p3=Math.min(.2,E*.004-.08);
  const map=new Map,arrows=[],inb=(r,c)=>r>=0&&c>=0&&r<nr&&c<nc,tries=nr*nc*8+400;let filled=0;
  for(let t=0;t<tries&&filled<target*nr*nc;t++){
    let r=R()*nr|0,c=R()*nc|0;if(map.has(K(r,c)))continue;
    const len=2+(R()*(maxLen-1)|0),cells=[[r,c]],own=new Set([K(r,c)]);let d=null;
    while(cells.length<len){
      const o=D.filter(([a,b])=>inb(r+a,c+b)&&!map.has(K(r+a,c+b))&&!own.has(K(r+a,c+b)));
      if(!o.length)break;
      const st=d&&o.find(x=>x[0]==d[0]&&x[1]==d[1]);
      d=st&&R()<.6?st:o[R()*o.length|0];r+=d[0];c+=d[1];cells.push([r,c]);own.add(K(r,c));
    }
    if(cells.length<2)continue;
    let rr=r+d[0],cc=c+d[1],ok=true,m=0;
    while(inb(rr,cc)){if(map.has(K(rr,cc))||own.has(K(rr,cc))){ok=false;break}rr+=d[0];cc+=d[1];m++}
    if(!ok)continue;
    const u=R(),rs=cells.map(q=>q[0]),cs=cells.map(q=>q[1]);
    const a={cells,d,m,col:R()*6|0,hp:u<p3?3:u<p2?2:1,alive:true,done:false,o:0,shake:0,hint:0,
      r0:Math.min(...rs),r1:Math.max(...rs),c0:Math.min(...cs),c1:Math.max(...cs)};
    cells.forEach(q=>map.set(K(q[0],q[1]),a));filled+=cells.length;arrows.push(a);
  }
  return{nr,nc,arrows,map,left:arrows.length};
}
function start(n){
  level=n;G=gen(n);lives=3;over=false;px=py=0;ov.classList.remove('on');
  $('#title').textContent='Level '+n;layout();z=Math.min(maxZ(),Math.max(1,30/bs));apply();ui();
}
const maxZ=()=>Math.max(6,80/bs);
function ui(){
  $('#hearts').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);
  $('#left').textContent=G.left+' of '+G.arrows.length+' left';
}
function apply(){clampPan();s=bs*z;ox=W/2+(bx-W/2)*z+px;oy=H/2+(by-H/2)*z+py}
function layout(){
  const r=stage.getBoundingClientRect(),dpr=devicePixelRatio||1;W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;
  if(!G)return;
  bs=Math.min((W-24)/G.nc,(H-24)/G.nr,90);bx=(W-bs*G.nc)/2;by=(H-bs*G.nr)/2;apply();
}
function clampPan(){
  const mx=bs*G.nc*z>W?(bs*G.nc*z-W)/2+40:0,my=bs*G.nr*z>H?(bs*G.nr*z-H)/2+40:0;
  px=Math.min(mx,Math.max(-mx,px));py=Math.min(my,Math.max(-my,py));
}
function zoomAt(cx,cy,nz){
  nz=Math.min(maxZ(),Math.max(.5,nz));const u=cx-W/2-px,v=cy-H/2-py,r=nz/z;
  px=cx-W/2-u*r;py=cy-H/2-v*r;z=nz;apply();
}
$('#zi').onclick=()=>zoomAt(W/2,H/2,z*1.4);
$('#zo').onclick=()=>zoomAt(W/2,H/2,z/1.4);
$('#zf').onclick=()=>{z=1;px=py=0;apply()};
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,z*Math.exp(-e.deltaY*.0015))},{passive:false});

function colors(){const c=getComputedStyle(document.documentElement);cols=[0,1,2,3,4,5].map(i=>c.getPropertyValue('--a'+i).trim());cols.dot=c.getPropertyValue('--dot').trim();cols.ink=c.getPropertyValue('--ink').trim();cols.panel=c.getPropertyValue('--panel').trim()}
colors();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',colors);

function free(a){
  const h=a.cells[a.cells.length-1];let r=h[0]+a.d[0],c=h[1]+a.d[1];
  while(r>=0&&c>=0&&r<G.nr&&c<G.nc){if(G.map.has(K(r,c)))return false;r+=a.d[0];c+=a.d[1]}
  return true;
}
function tap(x,y){
  if(over||!G)return;
  const b=cv.getBoundingClientRect(),c=Math.floor((x-b.left-ox)/s),r=Math.floor((y-b.top-oy)/s);
  if(r<0||c<0||r>=G.nr||c>=G.nc)return;
  const a=G.map.get(K(r,c));if(!a)return;
  const now=performance.now();
  if(free(a)){
    if(a.hp>1){a.hp--;a.hint=now+300;return}
    a.alive=false;a.cells.forEach(q=>G.map.delete(K(q[0],q[1])));G.left--;ui();return;
  }
  a.shake=now+350;lives--;ui();
  if(navigator.vibrate)navigator.vibrate(40);
  if(lives<=0){over=true;setTimeout(()=>dialog('Out of hearts','Every blocked tap costs one. Give it another go.',[['Retry level',()=>start(level),1]]),400)}
}
const P=new Map();let pinch=null,moved=false,multi=false,sx=0,sy=0;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(P.size==1){moved=false;multi=false;sx=e.clientX;sy=e.clientY}
  if(P.size==2){multi=true;moved=true;const[a,b]=[...P.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z}}
});
cv.addEventListener('pointermove',e=>{
  const p=P.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(P.size==2&&pinch){const[a,b]=[...P.values()],r=cv.getBoundingClientRect();zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d)}
  else if(P.size==1){if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>8)moved=true;if(moved){px+=dx;py+=dy;apply()}}
});
const up=e=>{
  if(!P.has(e.pointerId))return;
  const single=P.size==1&&!moved&&!multi;P.delete(e.pointerId);pinch=null;
  if(P.size>0)moved=true;
  if(single&&e.type=='pointerup')tap(e.clientX,e.clientY);
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

$('#hint').onclick=()=>{
  if(over)return;let best=null,bd=1e18;
  for(const a of G.arrows){if(!a.alive||!free(a))continue;const q=a.cells[a.cells.length-1],x=ox+(q[1]+.5)*s-W/2,y=oy+(q[0]+.5)*s-H/2,d=x*x+y*y;if(d<bd){bd=d;best=a}}
  if(!best)return;best.hint=performance.now()+1800;
  if(bd>(Math.min(W,H)*.4)**2){const q=best.cells[best.cells.length-1];px=-(bx+(q[1]+.5)*bs-W/2)*z;py=-(by+(q[0]+.5)*bs-H/2)*z;apply()}
};
function levels(pg){
  const per=100,pages=Math.ceil(MAX/per),lo=pg*per+1,hi=Math.min(MAX,lo+per-1);
  let h='<h2>Levels</h2><p>'+unlocked+' unlocked of '+MAX+'</p><div id="grid">';
  for(let i=lo;i<=hi;i++)h+='<button data-n="'+i+'"'+(i>unlocked?' disabled':'')+(i==level?' class="cur"':'')+'>'+i+'</button>';
  h+='</div><div class="pg"><button id="pp"'+(pg?'':' disabled')+'>Prev</button><span>'+lo+'–'+hi+'</span><button id="pn"'+(pg<pages-1?'':' disabled')+'>Next</button></div><button id="x">Close</button>';
  box.innerHTML=h;ov.classList.add('on');
  box.querySelectorAll('#grid button').forEach(b=>b.onclick=()=>start(+b.dataset.n));
  $('#pp').onclick=()=>levels(pg-1);$('#pn').onclick=()=>levels(pg+1);$('#x').onclick=()=>ov.classList.remove('on');
}
$('#lv').onclick=()=>levels((level-1)/100|0);
function setup(){
  const old=JSON.stringify(cfg);
  const draw=()=>{
    box.innerHTML='<h2>Game setup</h2><p>Board growth per level</p><div class="ch" id="cg"></div><p style="margin-top:16px">Difficulty</p><div class="ch" id="cd"></div><p id="info" style="margin-top:16px"></p><button class="p" id="x">Done</button>';
    GL.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(i==cfg.g)b.className='on';b.onclick=()=>{cfg.g=i;draw()};$('#cg').appendChild(b)});
    DL.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(i==cfg.d)b.className='on';b.onclick=()=>{cfg.d=i;draw()};$('#cd').appendChild(b)});
    const a=dims(level),b=dims(level+10);
    $('#info').textContent='Level '+level+' board: '+a.nc+'×'+a.nr+'. Level '+(level+10)+': '+b.nc+'×'+b.nr+'.';
    $('#x').onclick=()=>{try{localStorage.setItem('arrowEscapeCfg',JSON.stringify(cfg))}catch(e){}if(JSON.stringify(cfg)!=old)start(level);else ov.classList.remove('on')};
  };
  draw();ov.classList.add('on');
}
$('#su').onclick=setup;
function dialog(t,p,btns){
  box.innerHTML='<h2>'+t+'</h2><p>'+p+'</p>';
  btns.forEach(([l,f,pr])=>{const b=document.createElement('button');b.textContent=l;if(pr)b.className='p';b.onclick=f;b.style.margin='0 4px';box.appendChild(b)});
  ov.classList.add('on');
}
function pt(a,x){
  const n=a.cells.length,Pc=q=>[ox+(q[1]+.5)*s,oy+(q[0]+.5)*s],B=(n-1)*s;
  if(x<=B){const i=Math.min(n-2,Math.max(0,Math.floor(x/s))),f=(x-i*s)/s,p=Pc(a.cells[i]),q=Pc(a.cells[i+1]);return[p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f]}
  const h=Pc(a.cells[n-1]),e=x-B;return[h[0]+a.d[1]*e,h[1]+a.d[0]*e];
}
function drawArrow(a,now){
  const n=a.cells.length,B=(n-1)*s,st=a.o,en=st+B,xs=[st];
  for(let i=1;i<n;i++){const v=i*s;if(v>st&&v<en)xs.push(v)}xs.push(en);
  const col=now<a.shake?cols.ink:cols[a.col];
  ctx.save();if(now<a.shake)ctx.translate(Math.sin(now/22)*s*.06,0);ctx.lineCap='round';ctx.lineJoin='round';
  const path=()=>{ctx.beginPath();xs.forEach((x,i)=>{const p=pt(a,x);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])})};
  if(now<a.hint){path();ctx.strokeStyle=cols.ink;ctx.globalAlpha=.35+.25*Math.sin(now/120);ctx.lineWidth=s*.46;ctx.stroke();ctx.globalAlpha=1}
  path();ctx.strokeStyle=col;ctx.lineWidth=s*.26;ctx.stroke();
  const h=pt(a,en),u=a.d,w=s*.3,l=s*.3;
  ctx.beginPath();ctx.moveTo(h[0]+u[1]*l,h[1]+u[0]*l);ctx.lineTo(h[0]-u[0]*w*.9,h[1]+u[1]*w*.9);ctx.lineTo(h[0]+u[0]*w*.9,h[1]-u[1]*w*.9);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();
  if(a.hp>1&&s>10){
    const m=pt(a,st+B/2);ctx.beginPath();ctx.arc(m[0],m[1],s*.27,0,7);ctx.fillStyle=cols.panel;ctx.fill();ctx.lineWidth=s*.06;ctx.strokeStyle=col;ctx.stroke();
    ctx.fillStyle=cols.ink;ctx.font='700 '+s*.34+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.hp,m[0],m[1]+s*.02);
  }
  ctx.restore();
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const dpr=devicePixelRatio||1;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(G){
    const c0=Math.floor(-ox/s)-1,c1=Math.ceil((W-ox)/s)+1,r0=Math.floor(-oy/s)-1,r1=Math.ceil((H-oy)/s)+1;
    if(s>5){ctx.fillStyle=cols.dot;
      for(let r=Math.max(0,r0);r<Math.min(G.nr,r1);r++)for(let c=Math.max(0,c0);c<Math.min(G.nc,c1);c++){ctx.beginPath();ctx.arc(ox+(c+.5)*s,oy+(r+.5)*s,Math.max(.8,s*.05),0,7);ctx.fill()}}
    else{ctx.strokeStyle=cols.dot;ctx.lineWidth=1;ctx.strokeRect(ox,oy,G.nc*s,G.nr*s)}
    let all=true;
    for(const a of G.arrows){
      if(a.done)continue;all=false;
      if(!a.alive){a.o+=dt*s*(9+a.o/s*2.2);if(a.o>=(a.cells.length+a.m)*s){a.done=true;continue}}
      else if(a.c1<c0||a.c0>c1||a.r1<r0||a.r0>r1)continue;
      drawArrow(a,now);
    }
    if(all&&!over){
      over=true;if(level==unlocked&&unlocked<MAX){unlocked++;save()}
      setTimeout(()=>dialog('Level '+level+' cleared',lives==3?'No hearts lost.':lives+(lives==1?' heart':' hearts')+' left.',[['Levels',()=>levels((level-1)/100|0)],[level<MAX?'Next level':'Start over',()=>start(level<MAX?level+1:1),1]]),250);
    }
  }
  requestAnimationFrame(frame);
}
addEventListener('resize',layout);
start(unlocked);requestAnimationFrame(frame);
</script>
</body>
</html>
